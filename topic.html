<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Topics • Riki's OS 🧸</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <header>
        <p class="small-text">RIKI'S OS • STUDY</p>
        <h1 id="topic-title">Topics 📚</h1>
        <p id="topic-subtitle">Track your study progress, Riki. 🧸</p>
    </header>

    <!-- Add Topic -->
    <section class="study-page-card">

        <div class="section-heading">
            <div>
                <p class="small-text">STUDY TRACKER</p>
                <h2>My Topics 🎯</h2>
            </div>
            <span>📚</span>
        </div>

        <div id="topic-list"></div>

        <button class="add-topic-btn" onclick="addTopic()">
            + Add Topic
        </button>

    </section>

    <button class="back-btn" onclick="history.back()">
        ← Back to Subject
    </button>

</div>

<script>

const subject =
    localStorage.getItem("selectedSubject") || "Subject";

const semester =
    localStorage.getItem("selectedSemester") || "";

document.getElementById("topic-title").textContent =
    "📖 " + subject;

document.getElementById("topic-subtitle").textContent =
    "Semester " + semester + " • Topics 📚";


// =========================
// LOAD TOPICS
// =========================

let topics = JSON.parse(
    localStorage.getItem("rikiTopics_" + subject) || "[]"
);


// =========================
// ADD TOPIC
// =========================

function addTopic() {

    const name = prompt("📚 Enter topic name:");

    if (!name || !name.trim()) return;

    topics.push({
        name: name.trim(),
        status: "Not Started"
    });

    saveTopics();
    displayTopics();
}


// =========================
// SAVE TOPICS
// =========================

function saveTopics() {

    localStorage.setItem(
        "rikiTopics_" + subject,
        JSON.stringify(topics)
    );

}


// =========================
// EDIT TOPIC
// =========================

function editTopic(index) {

    const topic = topics[index];

    const newName = prompt(
        "✏️ Edit topic name:",
        topic.name
    );

    if (!newName || !newName.trim()) return;

    topics[index].name = newName.trim();

    saveTopics();
    displayTopics();
}


// =========================
// DELETE TOPIC
// =========================

function deleteTopic(index) {

    const topic = topics[index];

    const confirmDelete = confirm(
        `🧸 Delete "${topic.name}"?\n\nThis cannot be undone.`
    );

    if (!confirmDelete) return;

    topics.splice(index, 1);

    saveTopics();
    displayTopics();
}


// =========================
// DISPLAY TOPICS
// =========================

function displayTopics() {

    const list =
        document.getElementById("topic-list");

    list.innerHTML = "";

    if (topics.length === 0) {

        list.innerHTML = `
            <div class="empty-topic">

                <span>📚</span>

                <strong>
                    No topics added yet
                </strong>

                <small>
                    Add your first topic to start tracking.
                </small>

            </div>
        `;

        return;
    }


    topics.forEach((topic, index) => {

        list.innerHTML += `

            <div class="topic-card">

                <div style="flex:1;">

                    <strong>
                        📖 ${topic.name}
                    </strong>

                    <small>
                        Status: ${topic.status}
                    </small>

                </div>


                <select
                    onchange="changeStatus(${index}, this.value)"
                >

                    <option
                        ${topic.status === "Not Started" ? "selected" : ""}>
                        Not Started
                    </option>

                    <option
                        ${topic.status === "In Progress" ? "selected" : ""}>
                        In Progress
                    </option>

                    <option
                        ${topic.status === "Completed" ? "selected" : ""}>
                        Completed
                    </option>

                </select>


                <div
                    style="
                        display:flex;
                        gap:8px;
                        margin-left:8px;
                    "
                >

                    <button
                        onclick="editTopic(${index})"
                        style="
                            border:1px solid #3a4358;
                            background:#1b2232;
                            color:#c9b4ff;
                            padding:8px 10px;
                            border-radius:10px;
                            cursor:pointer;
                        "
                    >
                        ✏️
                    </button>


                    <button
                        onclick="deleteTopic(${index})"
                        style="
                            border:1px solid #3a4358;
                            background:#1b2232;
                            color:#ff9fae;
                            padding:8px 10px;
                            border-radius:10px;
                            cursor:pointer;
                        "
                    >
                        🗑️
                    </button>

                </div>

            </div>

        `;

    });

}


// =========================
// CHANGE STATUS
// =========================

function changeStatus(index, status) {

    topics[index].status = status;

    saveTopics();
    displayTopics();

}


// =========================
// START
// =========================

displayTopics();

</script>

</body>
</html>
