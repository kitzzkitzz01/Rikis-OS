<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Code Lab • Riki's OS 🧸</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <header>
        <p class="small-text">RIKI'S OS • CODE LAB</p>
        <h1>Code Lab 💻</h1>
        <p>Build your coding skills, one step at a time. 🧸</p>
    </header>


    <section class="study-page-card">

        <div class="section-heading">

            <div>
                <p class="small-text">CODING JOURNEY</p>
                <h2>My Skills 🧩</h2>
            </div>

            <span>💻</span>

        </div>


        <div id="skill-list"></div>


        <button
            class="add-topic-btn"
            type="button"
            onclick="addSkill()"
        >
            + Add Skill
        </button>

    </section>


    <section class="study-page-card">

        <div class="section-heading">

            <div>
                <p class="small-text">PRACTICE</p>
                <h2>Coding Goals 🎯</h2>
            </div>

            <span>🔥</span>

        </div>


        <div id="goal-list"></div>


        <button
            class="add-topic-btn"
            type="button"
            onclick="addGoal()"
        >
            + Add Coding Goal
        </button>

    </section>


    <button
        class="back-btn"
        type="button"
        onclick="history.back()"
    >
        ← Back to Riki's OS
    </button>

</div>


<script>

// =========================
// LOAD DATA
// =========================

let skills = JSON.parse(
    localStorage.getItem("rikiCodingSkills") || "[]"
);

let goals = JSON.parse(
    localStorage.getItem("rikiCodingGoals") || "[]"
);


// =========================
// SKILLS
// =========================

function saveSkills() {

    localStorage.setItem(
        "rikiCodingSkills",
        JSON.stringify(skills)
    );

}


function addSkill() {

    const name = prompt(
        "💻 Enter a skill you are learning:"
    );

    if (!name || !name.trim()) return;

    skills.push({
        name: name.trim(),
        status: "Learning"
    });

    saveSkills();
    displaySkills();

}


function editSkill(index) {

    const newName = prompt(
        "✏️ Edit skill name:",
        skills[index].name
    );

    if (!newName || !newName.trim()) return;

    skills[index].name = newName.trim();

    saveSkills();
    displaySkills();

}


function deleteSkill(index) {

    const confirmed = confirm(
        "🧸 Delete this skill?"
    );

    if (!confirmed) return;

    skills.splice(index, 1);

    saveSkills();
    displaySkills();

}


function changeSkillStatus(index, status) {

    skills[index].status = status;

    saveSkills();
    displaySkills();

}


function displaySkills() {

    const list =
        document.getElementById("skill-list");

    list.innerHTML = "";


    if (skills.length === 0) {

        list.innerHTML = `
            <div class="empty-topic">

                <span>💻</span>

                <strong>
                    No skills added yet
                </strong>

                <small>
                    Add the coding skills you want to learn.
                </small>

            </div>
        `;

        return;
    }


    skills.forEach(function(skill, index) {

        list.innerHTML += `

            <div class="topic-card">

                <div style="flex:1;">

                    <strong>
                        💻 ${skill.name}
                    </strong>

                    <small>
                        Status: ${skill.status}
                    </small>

                </div>


                <select
                    onchange="changeSkillStatus(${index}, this.value)"
                >

                    <option value="Learning"
                        ${skill.status === "Learning" ? "selected" : ""}>
                        Learning
                    </option>

                    <option value="Practicing"
                        ${skill.status === "Practicing" ? "selected" : ""}>
                        Practicing
                    </option>

                    <option value="Completed"
                        ${skill.status === "Completed" ? "selected" : ""}>
                        Completed
                    </option>

                </select>


                <button
                    type="button"
                    onclick="editSkill(${index})"
                    style="
                        border:1px solid #3a4358;
                        background:#1b2232;
                        color:#c9b4ff;
                        padding:8px 10px;
                        border-radius:10px;
                        cursor:pointer;
                    "
                >
                    ✏️
                </button>


                <button
                    type="button"
                    onclick="deleteSkill(${index})"
                    style="
                        border:1px solid #3a4358;
                        background:#1b2232;
                        color:#ff9fae;
                        padding:8px 10px;
                        border-radius:10px;
                        cursor:pointer;
                    "
                >
                    🗑️
                </button>

            </div>

        `;

    });

}


// =========================
// CODING GOALS
// =========================

function saveGoals() {

    localStorage.setItem(
        "rikiCodingGoals",
        JSON.stringify(goals)
    );

}


function addGoal() {

    const name = prompt(
        "🎯 Enter your coding goal:"
    );

    if (!name || !name.trim()) return;

    goals.push({
        name: name.trim(),
        status: "Not Started"
    });

    saveGoals();
    displayGoals();

}


function editGoal(index) {

    const newName = prompt(
        "✏️ Edit coding goal:",
        goals[index].name
    );

    if (!newName || !newName.trim()) return;

    goals[index].name = newName.trim();

    saveGoals();
    displayGoals();

}


function deleteGoal(index) {

    const confirmed = confirm(
        "🧸 Delete this coding goal?"
    );

    if (!confirmed) return;

    goals.splice(index, 1);

    saveGoals();
    displayGoals();

}


function changeGoalStatus(index, status) {

    goals[index].status = status;

    saveGoals();
    displayGoals();

}


function displayGoals() {

    const list =
        document.getElementById("goal-list");

    list.innerHTML = "";


    if (goals.length === 0) {

        list.innerHTML = `
            <div class="empty-topic">

                <span>🎯</span>

                <strong>
                    No coding goals yet
                </strong>

                <small>
                    Add a goal and start working towards it.
                </small>

            </div>
        `;

        return;
    }


    goals.forEach(function(goal, index) {

        list.innerHTML += `

            <div class="topic-card">

                <div style="flex:1;">

                    <strong>
                        🎯 ${goal.name}
                    </strong>

                    <small>
                        Status: ${goal.status}
                    </small>

                </div>


                <select
                    onchange="changeGoalStatus(${index}, this.value)"
                >

                    <option value="Not Started"
                        ${goal.status === "Not Started" ? "selected" : ""}>
                        Not Started
                    </option>

                    <option value="In Progress"
                        ${goal.status === "In Progress" ? "selected" : ""}>
                        In Progress
                    </option>

                    <option value="Completed"
                        ${goal.status === "Completed" ? "selected" : ""}>
                        Completed
                    </option>

                </select>


                <button
                    type="button"
                    onclick="editGoal(${index})"
                    style="
                        border:1px solid #3a4358;
                        background:#1b2232;
                        color:#c9b4ff;
                        padding:8px 10px;
                        border-radius:10px;
                        cursor:pointer;
                    "
                >
                    ✏️
                </button>


                <button
                    type="button"
                    onclick="deleteGoal(${index})"
                    style="
                        border:1px solid #3a4358;
                        background:#1b2232;
                        color:#ff9fae;
                        padding:8px 10px;
                        border-radius:10px;
                        cursor:pointer;
                    "
                >
                    🗑️
                </button>

            </div>

        `;

    });

}


// =========================
// START
// =========================

displaySkills();
displayGoals();

</script>

</body>

</html>
