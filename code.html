<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Code Lab • Riki's OS 🧸</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <header>
        <p class="small-text">RIKI'S OS • CODE LAB</p>
        <h1>Code Lab 💻</h1>
        <p>Build your coding skills, one step at a time. 🧸</p>
    </header>


    <!-- =========================
         MY SKILLS
         ========================= -->

    <section class="study-page-card">

        <div class="section-heading">

            <div>
                <p class="small-text">CODING JOURNEY</p>
                <h2>My Skills 🧩</h2>
            </div>

            <span>💻</span>

        </div>


        <div id="skill-list"></div>


        <button
            class="add-topic-btn"
            id="add-skill-btn"
            type="button"
        >
            + Add Skill
        </button>

    </section>


    <!-- =========================
         CODING GOALS
         ========================= -->

    <section class="study-page-card">

        <div class="section-heading">

            <div>
                <p class="small-text">PRACTICE</p>
                <h2>Coding Goals 🎯</h2>
            </div>

            <span>🔥</span>

        </div>


        <div id="goal-list"></div>


        <button
            class="add-topic-btn"
            id="add-goal-btn"
            type="button"
        >
            + Add Coding Goal
        </button>

    </section>


    <button
        class="back-btn"
        type="button"
        onclick="history.back()"
    >
        ← Back to Riki's OS
    </button>

</div>


<script>

// =========================
// LOAD DATA
// =========================

let skills = JSON.parse(
    localStorage.getItem("rikiCodingSkills") || "[]"
);

let goals = JSON.parse(
    localStorage.getItem("rikiCodingGoals") || "[]"
);


// =========================
// SAVE SKILLS
// =========================

function saveSkills() {

    localStorage.setItem(
        "rikiCodingSkills",
        JSON.stringify(skills)
    );

}


// =========================
// SAVE GOALS
// =========================

function saveGoals() {

    localStorage.setItem(
        "rikiCodingGoals",
        JSON.stringify(goals)
    );

}


// =========================
// ADD SKILL
// =========================

function addSkill() {

    const name = window.prompt(
        "💻 Enter a skill you are learning:"
    );

    if (name === null || name.trim() === "") {
        return;
    }

    skills.push({
        name: name.trim(),
        status: "Learning"
    });

    saveSkills();
    displaySkills();

}


// =========================
// EDIT SKILL
// =========================

function editSkill(index) {

    const skill = skills[index];

    const newName = window.prompt(
        "✏️ Edit skill name:",
        skill.name
    );

    if (newName === null || newName.trim() === "") {
        return;
    }

    skills[index].name = newName.trim();

    saveSkills();
    displaySkills();

}


// =========================
// DELETE SKILL
// =========================

function deleteSkill(index) {

    const skill = skills[index];

    const confirmed = window.confirm(
        '🧸 Delete "' + skill.name + '"?\n\nThis cannot be undone.'
    );

    if (!confirmed) {
        return;
    }

    skills.splice(index, 1);

    saveSkills();
    displaySkills();

}


// =========================
// CHANGE SKILL STATUS
// =========================

function changeSkillStatus(index, status) {

    skills[index].status = status;

    saveSkills();
    displaySkills();

}


//
