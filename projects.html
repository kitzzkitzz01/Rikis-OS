<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Projects • Riki's OS 🧸</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <header>
        <p class="small-text">RIKI'S OS • PROJECTS</p>
        <h1>Project Garage 🛠️</h1>
        <p>Build something you're proud of, Riki. 🧸💻</p>
    </header>


    <section class="study-page-card">

        <div class="section-heading">
            <div>
                <p class="small-text">BUILD & TRACK</p>
                <h2>My Projects 🚀</h2>
            </div>

            <span>🛠️</span>
        </div>


        <div id="project-list"></div>


        <button
            class="add-topic-btn"
            type="button"
            onclick="addProject()"
        >
            + Add Project
        </button>

    </section>


    <button
        class="back-btn"
        type="button"
        onclick="history.back()"
    >
        ← Back to Riki's OS
    </button>

</div>


<script>

// =========================
// LOAD PROJECTS
// =========================

let projects = JSON.parse(
    localStorage.getItem("rikiProjects") || "[]"
);


// =========================
// SAVE PROJECTS
// =========================

function saveProjects() {

    localStorage.setItem(
        "rikiProjects",
        JSON.stringify(projects)
    );

}


// =========================
// ADD PROJECT
// =========================

function addProject() {

    const name = prompt(
        "🛠️ Enter project name:"
    );

    if (!name || !name.trim()) return;


    const tech = prompt(
        "💻 Enter technology used (example: Python):"
    );

    if (!tech || !tech.trim()) return;


    projects.push({

        name: name.trim(),

        tech: tech.trim(),

        status: "Planning"

    });


    saveProjects();

    displayProjects();

}


// =========================
// EDIT PROJECT
// =========================

function editProject(index) {

    const newName = prompt(
        "✏️ Edit project name:",
        projects[index].name
    );

    if (!newName || !newName.trim()) return;


    const newTech = prompt(
        "💻 Edit technology:",
        projects[index].tech
    );

    if (!newTech || !newTech.trim()) return;


    projects[index].name = newName.trim();

    projects[index].tech = newTech.trim();


    saveProjects();

    displayProjects();

}


// =========================
// DELETE PROJECT
// =========================

function deleteProject(index) {

    const confirmed = confirm(
        "🧸 Delete this project?\n\nThis cannot be undone."
    );

    if (!confirmed) return;


    projects.splice(index, 1);


    saveProjects();

    displayProjects();

}


// =========================
// CHANGE STATUS
// =========================

function changeProjectStatus(index, status) {

    projects[index].status = status;


    saveProjects();

    displayProjects();

}


// =========================
// DISPLAY PROJECTS
// =========================

function displayProjects() {

    const list =
        document.getElementById("project-list");

    list.innerHTML = "";


    // Empty state

    if (projects.length === 0) {

        list.innerHTML = `

            <div class="empty-topic">

                <span>🛠️</span>

                <strong>
                    No projects yet
                </strong>

                <small>
                    Add your first project when you're ready.
                </small>

            </div>

        `;

        return;
    }


    // Display projects

    projects.forEach(function(project, index) {

        list.innerHTML += `

            <div class="topic-card">

                <div style="flex:1;">

                    <strong>
                        🛠️ ${project.name}
                    </strong>

                    <small>
                        💻 ${project.tech}
                    </small>

                    <small>
                        Status: ${project.status}
                    </small>

                </div>


                <select
                    onchange="changeProjectStatus(${index}, this.value)"
                >

                    <option
                        value="Planning"
                        ${project.status === "Planning" ? "selected" : ""}
                    >
                        Planning
                    </option>


                    <option
                        value="In Progress"
                        ${project.status === "In Progress" ? "selected" : ""}
                    >
                        In Progress
                    </option>


                    <option
                        value="Completed"
                        ${project.status === "Completed" ? "selected" : ""}
                    >
                        Completed
                    </option>

                </select>


                <button
                    type="button"
                    onclick="editProject(${index})"
                    style="
                        border:1px solid #3a4358;
                        background:#1b2232;
                        color:#c9b4ff;
                        padding:8px 10px;
                        border-radius:10px;
                        cursor:pointer;
                    "
                >
                    ✏️
                </button>


                <button
                    type="button"
                    onclick="deleteProject(${index})"
                    style="
                        border:1px solid #3a4358;
                        background:#1b2232;
                        color:#ff9fae;
                        padding:8px 10px;
                        border-radius:10px;
                        cursor:pointer;
                    "
                >
                    🗑️
                </button>

            </div>

        `;

    });

}


// =========================
// START
// =========================

displayProjects();

</script>

</body>

</html>
